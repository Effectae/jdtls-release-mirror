name: Sync Tags

permissions:
  contents: write

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      tags: ${{ steps.sync.outputs.tags }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
          git

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"


      - name: Sync tags
        id: sync
        run: |
          mkdir tmp
          TAGS=""
          . fetch_versions.sh
          for V in $(< $VERSIONS_PATH)
          do
            TAG="v$V"
            git show-ref --tags --quiet --verify "refs/tags/$TAG" && continue
            git tag "$TAG" -m "CI auto tag $TAG"
            TAGS="$TAGS $TAG"
          done
          git push origin $TAGS
          echo $TAGS
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
  find-matrix:
    needs: sync
    outputs: 
      matrix: ${{ steps.matrix.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - id: matrix
        run: |
          TAGS='${{ needs.sync.outputs.tags }}'
          JSON="["
          for TAG in $TAGS
          do
            JSON="$JSON{\"tag\":\"$TAG\"},"
          done
          JSON="$JSON]"
          echo "matrix={\"include\":$JSON}" >> "$GITHUB_OUTPUT"
  mirror:
    needs: find-matrix
    strategy:
      matrix: ${{ fromJSON(needs.find-matrix.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/mirror-with-tag.yml
    with:
      tag: ${{ matrix.tag }}
    permissions:
      contents: write
